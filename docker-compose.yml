services:
  db:
    image: pgvector/pgvector:pg17
    container_name: book-intelligence-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: book_intelligence
    ports:
      # Mapped to 5434 so it doesn't collide with a locally installed Postgres.
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d book_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
